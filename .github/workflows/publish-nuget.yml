name: .NET build, test, and publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Glacier CLI
        run: dotnet tool install -g Glacier.Cli

      - name: Security Check
        shell: pwsh
        run: |
          glacier security-check .

      - name: Restore dependencies
        run: dotnet restore Glacier.Codec.slnx

      - name: Build
        run: dotnet build Glacier.Codec.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/Glacier.Codec.Tests/Glacier.Codec.Tests.csproj --configuration Release --no-restore --no-build --filter "Category!=ConstantTime" --verbosity normal

      - name: Run constant-time tests
        run: dotnet test tests/Glacier.Codec.Tests/Glacier.Codec.Tests.csproj --configuration Release --no-restore --no-build --filter "Category=ConstantTime" --verbosity normal -- xunit.parallelizeTestCollections=false

      - name: Pack NuGet Package
        run: dotnet pack src/Glacier.Codec/Glacier.Codec.csproj --configuration Release --no-build --output packages

      - name: NuGet login (Trusted Publishing OIDC)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: spuriousbugfix

      - name: Publish to nuget.org
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          NUGET_OIDC_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $pkgs = Get-ChildItem -Path "packages" -Filter "*.nupkg"
          if (-not $pkgs) { throw "No .nupkg files found in packages directory." }
          foreach ($pkg in $pkgs) {
            dotnet nuget push $pkg.FullName --api-key $env:NUGET_OIDC_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name "github-packages" --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text 2>$null
          $global:LASTEXITCODE = 0
          $pkgs = Get-ChildItem -Path "packages" -Filter "*.nupkg"
          foreach ($pkg in $pkgs) {
            dotnet nuget push $pkg.FullName --api-key "${{ secrets.GITHUB_TOKEN }}" --source "github-packages" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.nupkg
          generate_release_notes: true
